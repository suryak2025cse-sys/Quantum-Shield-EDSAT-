name: QuantumShield AI Security Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  quantum-security-scan:
    name: Crypto Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scan baseline (if exists)
        id: restore-baseline
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: qs_baseline.json
          key: qs-baseline-${{ github.ref }}
          restore-keys: |
            qs-baseline-refs/heads/main
            qs-baseline-

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantumshield-report-${{ github.sha }}
          path: backend/qs_report.json
          retention-days: 30

      - name: Post scan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('backend/qs_report.json', 'utf8'));
              const summary = report.quantumshield_cicd_report.summary;
              const gateStatus = summary.gate_passed ? '✅ PASSED' : '❌ FAILED';
              const body = `## QuantumShield AI Security Gate: ${gateStatus}
              
              | Metric | Count |
              |--------|-------|
              | 🚫 Blocked | ${summary.blocked} |
              | ⚠️ Warned | ${summary.warned} |
              | ✅ Allowed | ${summary.allowed} |
              | Total new findings | ${summary.total_new_findings} |
              
              ${summary.gate_passed ? 'No blocking security issues introduced.' : '**Pipeline blocked due to critical security findings. See detailed report in artifacts.**'}
              
              *Scan powered by [QuantumShield AI](https://github.com/your-org/quantumshield-ai)*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } catch(e) {
              console.log('Could not post PR comment:', e.message);
            }

      - name: Cache new baseline
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: qs_baseline.json
          key: qs-baseline-${{ github.ref }}

